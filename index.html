<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1220">
<title>Piano na Tela</title>
<style>
  :root{--bg:#0f1220;--panel:#1a1e33;--accent:#5eead4;--accent2:#f472b6;
    --text:#e8eaf2;--muted:#9aa0be;--danger:#f87171;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;}
  #view{position:relative;flex:1;overflow:hidden;background:#000;}
  #canvas{position:absolute;inset:0;touch-action:none;background:#000;}
  #hint{position:absolute;top:0;left:0;right:0;padding:7px 12px;
    background:linear-gradient(#000a,#0000);font-size:12.5px;line-height:1.3;
    text-shadow:0 1px 3px #000;pointer-events:none;}
  #hint b{color:var(--accent);}
  .badge{position:absolute;top:8px;right:10px;font-size:11px;color:var(--muted);
    background:#0006;padding:4px 8px;border-radius:20px;pointer-events:none;}
  #bar{background:var(--panel);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:7px;box-shadow:0 -6px 20px #0006;}
  .row{display:flex;gap:8px;align-items:center;}
  button{flex:1;min-width:0;border:0;border-radius:12px;padding:11px 8px;font-size:14px;
    font-weight:600;color:#0b1020;background:var(--accent);cursor:pointer;}
  button.sec{background:#2a3050;color:var(--text);}
  button:active{transform:scale(.97);}
  .oct{flex:0 0 52px;font-size:20px;}
  label{font-size:12px;color:var(--muted);}
  input[type=range]{width:100%;accent-color:var(--accent);}
  .pill{background:#0d1122;border-radius:10px;padding:7px 10px;font-size:13px;color:var(--muted);
    display:flex;align-items:center;gap:8px;flex:1;justify-content:center;}
  .pill b{color:var(--text);}
  #startScreen{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;}
  #startScreen h1{margin:0;font-size:26px;}
  #startScreen p{margin:0;color:var(--muted);max-width:360px;line-height:1.5;font-size:15px;}
  #startScreen button{flex:0;padding:14px 26px;font-size:16px;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="stage">
  <div id="view">
    <canvas id="canvas"></canvas>
    <div id="hint"></div>
    <div class="badge" id="fps"></div>
    <div id="startScreen">
      <div style="font-size:40px">🎹👣</div>
      <h1>Piano na Tela</h1>
      <p>Aponte a câmera pro chão. A ponta do pé/dedo que encostar no ponto da tecla toca a nota. Use "Girar 90°" para posicionar o teclado.</p>
      <button id="startBtn">Ligar a câmera</button>
      <p id="startErr" style="color:#f87171;font-size:13px;white-space:pre-wrap;max-width:360px;margin:0"></p>
      <p style="opacity:.45;font-size:11px;margin:0">versão 7 · detecção de ponta + girar 90°</p>
    </div>
  </div>

  <div id="bar">
    <div class="row">
      <div class="pill">Giro: <b id="rotLabel">0°</b></div>
      <div class="pill">Nota: <b id="playingLabel">—</b></div>
    </div>
    <div class="row">
      <label style="flex:1">Sensibilidade
        <input type="range" id="sens" min="12" max="90" value="34">
      </label>
    </div>
    <div class="row">
      <button class="sec" id="rot">⟳ Girar 90°</button>
      <button class="sec" id="rebg">Refazer fundo</button>
    </div>
    <div class="row">
      <button class="sec oct" id="octDown">–</button>
      <div class="pill" style="flex:1">Oitava: <b id="octLabel">4</b> · use – / +</div>
      <button class="sec oct" id="octUp">+</button>
    </div>
  </div>
</div>

<script>
/* ================= Áudio ================= */
let audioCtx=null, masterGain=null;
function initAudio(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain(); masterGain.gain.value=0.85;
  masterGain.connect(audioCtx.destination);
}
const activeVoices={};
function midiToFreq(m){return 440*Math.pow(2,(m-69)/12);}
function noteOn(id,midi){
  if(!audioCtx||activeVoices[id]) return;
  const now=audioCtx.currentTime, freq=midiToFreq(midi);
  const g=audioCtx.createGain(); g.connect(masterGain);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.exponentialRampToValueAtTime(0.35,now+0.008);
  g.gain.exponentialRampToValueAtTime(0.16,now+0.35);
  const partials=[[1,1.0],[2,0.35],[3,0.18],[4,0.09]], oscs=[];
  partials.forEach(([mult,amp])=>{
    const o=audioCtx.createOscillator(); o.type='triangle'; o.frequency.value=freq*mult;
    const pg=audioCtx.createGain(); pg.gain.value=amp;
    o.connect(pg); pg.connect(g); o.start(now); oscs.push(o);
  });
  activeVoices[id]={oscs,g};
}
function noteOff(id){
  const v=activeVoices[id]; if(!v||!audioCtx) return;
  const now=audioCtx.currentTime;
  v.g.gain.cancelScheduledValues(now);
  v.g.gain.setValueAtTime(Math.max(v.g.gain.value,0.0001),now);
  v.g.gain.exponentialRampToValueAtTime(0.0001,now+0.18);
  v.oscs.forEach(o=>o.stop(now+0.2));
  delete activeVoices[id];
}
function allOff(){ for(const k in activeVoices) noteOff(k); current=null; }

/* ================= base / estado ================= */
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const video=document.createElement('video');
video.setAttribute('playsinline',''); video.muted=true;

let stream=null, running=false, sensitivity=34, current=null;
let octaveBase=4, rotStep=0;

/* teclado lógico: 7 brancas + 5 pretas, ordem Dó..Si preservada */
const LW=7, LH=2.4;
const WHITE=[{semi:0,name:'Dó'},{semi:2,name:'Ré'},{semi:4,name:'Mi'},
             {semi:5,name:'Fá'},{semi:7,name:'Sol'},{semi:9,name:'Lá'},{semi:11,name:'Si'}];
const BLACK=[{semi:1,after:0,name:'Dó#'},{semi:3,after:1,name:'Ré#'},
             {semi:6,after:3,name:'Fá#'},{semi:8,after:4,name:'Sol#'},{semi:10,after:5,name:'Lá#'}];
const keys=[];
WHITE.forEach((w,i)=>keys.push({id:'w'+i,semi:w.semi,name:w.name,black:false,wi:i,_snd:false}));
BLACK.forEach((b,j)=>keys.push({id:'b'+j,semi:b.semi,name:b.name,black:true,after:b.after,_snd:false}));
function keyMidi(k){ return 12*(octaveBase+1)+k.semi; }
function keyLabel(k){ return k.name+octaveBase; }
for(const k of keys){
  if(!k.black){ k.lx0=k.wi; k.lx1=k.wi+1; k.ly0=0; k.ly1=LH; k.ltx=k.wi+0.5; k.lty=LH*0.66; }
  else{ const c=k.after+1, bw=0.62; k.lx0=c-bw/2; k.lx1=c+bw/2; k.ly0=0; k.ly1=LH*0.58; k.ltx=c; k.lty=LH*0.30; }
}

let board={scale:1,cos:1,sin:0,cx:0,cy:0};
function Tp(lx,ly){
  const b=board, x=lx-LW/2, y=ly-LH/2;
  return { x:b.cx+(x*b.cos - y*b.sin)*b.scale, y:b.cy+(x*b.sin + y*b.cos)*b.scale };
}
function layout(){
  const W=canvas.width, H=canvas.height;
  const th=rotStep*Math.PI/2, cos=Math.round(Math.cos(th)), sin=Math.round(Math.sin(th));
  const bw=(rotStep%2===0)?LW:LH, bh=(rotStep%2===0)?LH:LW;
  const scale=Math.min(W*0.97/bw, H*0.90/bh);
  board={scale,cos,sin,cx:W/2,cy:H/2};
  for(const k of keys){
    const t=Tp(k.ltx,k.lty); k.x=t.x; k.y=t.y;
    k.rk=(k.black?0.30:0.42)*scale;
    k.c0=Tp(k.lx0,k.ly0); k.c1=Tp(k.lx1,k.ly0); k.c2=Tp(k.lx1,k.ly1); k.c3=Tp(k.lx0,k.ly1);
  }
}

/* ================= câmera ================= */
function showErr(m){const el=document.getElementById('startErr'); if(el) el.textContent=m;}
let starting=false;
async function start(){
  if(starting) return; starting=true; showErr('Abrindo a câmera…');
  try{ initAudio(); }catch(_){}
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showErr('A câmera precisa de HTTPS. Abra por um endereço https:// (ou localhost). Atual: '+location.protocol+'//'+location.host);
    starting=false; return;
  }
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}); }
  catch(e1){
    try{ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
    catch(e2){
      const n=e2.name||''; let dica='';
      if(n==='NotAllowedError') dica=' Permissão bloqueada: toque no cadeado ao lado do endereço → Permissões → Câmera → Permitir e recarregue.';
      else if(n==='NotReadableError') dica=' Outra aba/app está usando a câmera. Feche-os e tente de novo.';
      else if(n==='NotFoundError') dica=' Nenhuma câmera encontrada.';
      showErr('Falha ao abrir a câmera ('+(n||e2.message)+').'+dica); starting=false; return;
    }
  }
  showErr(''); starting=false;
  video.srcObject=stream; await video.play();
  document.getElementById('startScreen').classList.add('hidden');
  onResize();
  window.addEventListener('resize',onResize);
  window.addEventListener('orientationchange',()=>setTimeout(onResize,300));
  running=true; updateHint(); loop();
}
function sizeCanvas(){
  const v=document.getElementById('view');
  let W=v.clientWidth, H=v.clientHeight; if(!W||!H) return;
  const cap=780, s=Math.min(1,cap/Math.max(W,H));
  canvas.width=Math.max(4,Math.round(W*s)); canvas.height=Math.max(4,Math.round(H*s));
}
function onResize(){ sizeCanvas(); layout(); bg=null; }
function updateHint(){
  document.getElementById('hint').innerHTML=
    '<b>Ponta do pé/dedo</b> no ponto da tecla = toca. Aponte pro chão, fique parado e toque "Refazer fundo".';
}

function drawVideoCover(){
  const vw=video.videoWidth, vh=video.videoHeight; if(!vw||!vh) return;
  const cw=canvas.width, ch=canvas.height;
  const scale=Math.max(cw/vw, ch/vh);
  const sw=cw/scale, sh=ch/scale, sx=(vw-sw)/2, sy=(vh-sh)/2;
  ctx.drawImage(video, sx,sy,sw,sh, 0,0,cw,ch);
}

/* ============ detecção de PONTA (subtração de fundo) ============ */
let bg=null, bgW=0, bgH=0, step=6;
function resetBg(){ bg=null; }
function processFrame(){
  const W=canvas.width, H=canvas.height;
  step=Math.max(4, Math.round(W/150));
  const gw=Math.floor(W/step), gh=Math.floor(H/step);
  const img=ctx.getImageData(0,0,W,H).data;
  if(!bg || bgW!==gw || bgH!==gh){
    bg=new Float32Array(gw*gh); bgW=gw; bgH=gh;
    for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){const px=((j*step)*W+(i*step))*4;
      bg[j*gw+i]=0.299*img[px]+0.587*img[px+1]+0.114*img[px+2];}
    return null;
  }
  const thr=sensitivity; let sx=0,sy=0,cnt=0; const px=[],py=[];
  for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){
    const p=((j*step)*W+(i*step))*4;
    const g=0.299*img[p]+0.587*img[p+1]+0.114*img[p+2];
    const idx=j*gw+i, d=Math.abs(g-bg[idx]);
    if(d>thr){ const X=i*step,Y=j*step; px.push(X);py.push(Y); sx+=X;sy+=Y;cnt++; }
    else bg[idx]+=(g-bg[idx])*0.05;
  }
  if(cnt < Math.max(10, gw*gh*0.0015)) return null;
  const cxm=sx/cnt, cym=sy/cnt;
  let tipX=cxm,tipY=cym,best=-1;
  for(let p=0;p<px.length;p++){const dx=px[p]-cxm,dy=py[p]-cym,dd=dx*dx+dy*dy; if(dd>best){best=dd;tipX=px[p];tipY=py[p];}}
  return {x:tipX,y:tipY,cnt};
}
function activeKeyForTip(tip){
  if(!tip) return null;
  let best=null,bd=Infinity;
  for(const k of keys){const d=Math.hypot(k.x-tip.x,k.y-tip.y); if(d<k.rk && d<bd){bd=d;best=k;}}
  return best;
}
function applyTip(tip){
  const ak=activeKeyForTip(tip);
  const id=ak?ak.id:null;
  if(id!==current){ if(current) noteOff(current); if(id) noteOn(id,keyMidi(ak)); current=id; }
  for(const k of keys) k._snd=(k===ak);
  return ak;
}

/* ================= loop ================= */
let frames=0,fpsT=0,lastTip=null;
function loop(){
  if(!running) return;
  drawVideoCover();
  layout();
  const tip=processFrame(); lastTip=tip;
  applyTip(tip);
  document.getElementById('playingLabel').textContent = current ? keyLabel(keys.find(k=>k.id===current)) : '—';
  drawKeyboard();
  if(tip) drawTip(tip);
  const now=performance.now(); frames++;
  if(now-fpsT>1000){document.getElementById('fps').textContent=frames+' fps';frames=0;fpsT=now;}
  requestAnimationFrame(loop);
}

function poly(k){ ctx.beginPath(); ctx.moveTo(k.c0.x,k.c0.y); ctx.lineTo(k.c1.x,k.c1.y);
  ctx.lineTo(k.c2.x,k.c2.y); ctx.lineTo(k.c3.x,k.c3.y); ctx.closePath(); }
function drawKeyboard(){
  ctx.lineWidth=2;
  for(const k of keys){ if(k.black) continue;
    ctx.fillStyle = k._snd?'rgba(244,114,182,0.72)':'rgba(245,247,255,0.60)';
    ctx.strokeStyle='rgba(30,34,52,0.85)';
    poly(k); ctx.fill(); ctx.stroke();
    drawLabel(k,'#1a1e33'); drawTarget(k);
  }
  for(const k of keys){ if(!k.black) continue;
    ctx.fillStyle = k._snd?'rgba(244,114,182,0.78)':'rgba(70,74,86,0.72)';
    ctx.strokeStyle='rgba(255,255,255,0.35)';
    poly(k); ctx.fill(); ctx.stroke();
    drawLabel(k,'#e8eaf2'); drawTarget(k);
  }
}
function drawLabel(k,color){
  ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold '+(k.black?11:14)+'px system-ui';
  ctx.fillText(keyLabel(k), k.x, k.y - k.rk - (k.black?8:10));
}
function drawTarget(k){
  ctx.lineWidth=3;
  ctx.fillStyle = k._snd?'rgba(244,114,182,0.55)':'rgba(94,234,212,0.16)';
  ctx.strokeStyle = k._snd?'#f472b6':'#5eead4';
  ctx.beginPath(); ctx.arc(k.x,k.y,k.rk,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=k._snd?'#fff':'#5eead4'; ctx.beginPath(); ctx.arc(k.x,k.y,4,0,Math.PI*2); ctx.fill();
}
function drawTip(t){
  ctx.strokeStyle='#facc15'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(t.x,t.y,10,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(t.x-16,t.y); ctx.lineTo(t.x+16,t.y);
  ctx.moveTo(t.x,t.y-16); ctx.lineTo(t.x,t.y+16); ctx.stroke();
}

/* ================= controles ================= */
function setOctave(o){ octaveBase=Math.max(1,Math.min(6,o));
  document.getElementById('octLabel').textContent=octaveBase; allOff(); }
document.getElementById('startBtn').onclick=start;
document.getElementById('octDown').onclick=()=>setOctave(octaveBase-1);
document.getElementById('octUp').onclick=()=>setOctave(octaveBase+1);
document.getElementById('rebg').onclick=()=>{ resetBg(); allOff(); };
document.getElementById('rot').onclick=()=>{ rotStep=(rotStep+1)%4; layout();
  document.getElementById('rotLabel').textContent=(rotStep*90)+'°'; };
document.getElementById('sens').oninput=e=>{sensitivity=parseInt(e.target.value);};
</script>
</body>
</html>
