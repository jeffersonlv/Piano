<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1220">
<title>Piano na Tela</title>
<style>
  :root{--bg:#0f1220;--panel:#1a1e33;--accent:#5eead4;--accent2:#f472b6;
    --text:#e8eaf2;--muted:#9aa0be;--danger:#f87171;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;}
  #view{position:relative;flex:1;overflow:hidden;background:#000;}
  #canvas{position:absolute;inset:0;touch-action:none;background:#000;}
  #hint{position:absolute;top:0;left:0;right:0;padding:7px 12px;
    background:linear-gradient(#000a,#0000);font-size:12.5px;line-height:1.3;
    text-shadow:0 1px 3px #000;pointer-events:none;}
  #hint b{color:var(--accent);}
  .badge{position:absolute;top:8px;right:10px;font-size:11px;color:var(--muted);
    background:#0006;padding:4px 8px;border-radius:20px;pointer-events:none;}
  #bar{background:var(--panel);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:7px;box-shadow:0 -6px 20px #0006;}
  .row{display:flex;gap:8px;align-items:center;}
  button{flex:1;min-width:0;border:0;border-radius:12px;padding:11px 8px;font-size:14px;
    font-weight:600;color:#0b1020;background:var(--accent);cursor:pointer;}
  button.sec{background:#2a3050;color:var(--text);}
  button:active{transform:scale(.97);}
  .oct{flex:0 0 52px;font-size:20px;}
  label{font-size:12px;color:var(--muted);}
  input[type=range]{width:100%;accent-color:var(--accent);}
  .pill{background:#0d1122;border-radius:10px;padding:7px 10px;font-size:13px;color:var(--muted);
    display:flex;align-items:center;gap:8px;flex:1;justify-content:center;}
  .pill b{color:var(--text);}
  #startScreen{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;}
  #startScreen h1{margin:0;font-size:26px;}
  #startScreen p{margin:0;color:var(--muted);max-width:360px;line-height:1.5;font-size:15px;}
  #startScreen button{flex:0;padding:14px 26px;font-size:16px;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div id="stage">
  <div id="view">
    <canvas id="canvas"></canvas>
    <div id="hint"></div>
    <div class="badge" id="fps"></div>
    <div id="startScreen">
      <div style="font-size:40px">🎹👣</div>
      <h1>Piano na Tela</h1>
      <p>Aponte a câmera pro chão e cubra o ponto de cada tecla com o pé ou o dedo. Use "Girar teclado" para deixar as teclas na horizontal.</p>
      <button id="startBtn">Ligar a câmera</button>
      <p id="startErr" style="color:#f87171;font-size:13px;white-space:pre-wrap;max-width:360px;margin:0"></p>
      <p style="opacity:.45;font-size:11px;margin:0">versão 6 · tela cheia + girar teclado</p>
    </div>
  </div>

  <div id="bar">
    <div class="row">
      <div class="pill">Oitava: <b id="octLabel">4</b></div>
      <div class="pill">Nota: <b id="playingLabel">—</b></div>
    </div>
    <div class="row">
      <label style="flex:1">Sensibilidade
        <input type="range" id="sens" min="15" max="90" value="42">
      </label>
    </div>
    <div class="row">
      <label style="flex:1;display:flex;align-items:center;gap:10px;color:var(--text)">
        <input type="checkbox" id="mono" checked style="width:20px;height:20px;accent-color:var(--accent)">
        Uma nota por vez (evita tocar duas)
      </label>
    </div>
    <div class="row">
      <button class="sec" id="rot">⟳ Girar teclado</button>
      <button class="sec" id="rebg">Refazer fundo</button>
    </div>
    <div class="row">
      <button class="sec oct" id="octDown">–</button>
      <div class="pill" style="flex:1">use – / + para trocar a oitava</div>
      <button class="sec oct" id="octUp">+</button>
    </div>
  </div>
</div>

<script>
/* ================= Áudio ================= */
let audioCtx=null, masterGain=null;
function initAudio(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain(); masterGain.gain.value=0.85;
  masterGain.connect(audioCtx.destination);
}
const activeVoices={};
function midiToFreq(m){return 440*Math.pow(2,(m-69)/12);}
function noteOn(id,midi){
  if(!audioCtx||activeVoices[id]) return;
  const now=audioCtx.currentTime, freq=midiToFreq(midi);
  const g=audioCtx.createGain(); g.connect(masterGain);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.exponentialRampToValueAtTime(0.35,now+0.008);
  g.gain.exponentialRampToValueAtTime(0.16,now+0.35);
  const partials=[[1,1.0],[2,0.35],[3,0.18],[4,0.09]], oscs=[];
  partials.forEach(([mult,amp])=>{
    const o=audioCtx.createOscillator(); o.type='triangle'; o.frequency.value=freq*mult;
    const pg=audioCtx.createGain(); pg.gain.value=amp;
    o.connect(pg); pg.connect(g); o.start(now); oscs.push(o);
  });
  activeVoices[id]={oscs,g};
}
function noteOff(id){
  const v=activeVoices[id]; if(!v||!audioCtx) return;
  const now=audioCtx.currentTime;
  v.g.gain.cancelScheduledValues(now);
  v.g.gain.setValueAtTime(Math.max(v.g.gain.value,0.0001),now);
  v.g.gain.exponentialRampToValueAtTime(0.0001,now+0.18);
  v.oscs.forEach(o=>o.stop(now+0.2));
  delete activeVoices[id];
}
function allOff(){ for(const k in activeVoices) noteOff(k); monoCurrent=null; }

/* ================= Câmera / detecção ================= */
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const video=document.createElement('video');
video.setAttribute('playsinline',''); video.muted=true;

let stream=null, running=false, sensitivity=42, monoCurrent=null;
const SAMPLE=11;
let octaveBase=4;
let rot=false, rotAuto=true, lastRot=null;

/* modelo do teclado */
const WHITE=[{semi:0,name:'Dó'},{semi:2,name:'Ré'},{semi:4,name:'Mi'},
             {semi:5,name:'Fá'},{semi:7,name:'Sol'},{semi:9,name:'Lá'},{semi:11,name:'Si'}];
const BLACK=[{semi:1,after:0,name:'Dó#'},{semi:3,after:1,name:'Ré#'},
             {semi:6,after:3,name:'Fá#'},{semi:8,after:4,name:'Sol#'},{semi:10,after:5,name:'Lá#'}];
const keys=[];
WHITE.forEach((w,i)=>keys.push({id:'w'+i,semi:w.semi,name:w.name,black:false,wi:i,
  baseline:null,pressed:false,lastChange:0,delta:0,_snd:false,x:0,y:0,x0:0,y0:0,x1:0,y1:0}));
BLACK.forEach((b,j)=>keys.push({id:'b'+j,semi:b.semi,name:b.name,black:true,after:b.after,
  baseline:null,pressed:false,lastChange:0,delta:0,_snd:false,x:0,y:0,x0:0,y0:0,x1:0,y1:0}));
function keyMidi(k){ return 12*(octaveBase+1)+k.semi; }
function keyLabel(k){ return k.name+octaveBase; }

/* geometria: modo normal (colunas) ou girado (linhas) */
function layout(){
  const W=canvas.width, H=canvas.height;
  if(!rot){
    const mx=Math.round(W*0.02), top=Math.round(H*0.08), bot=Math.round(H*0.97);
    const ww=(W-2*mx)/7, span=bot-top, bw=ww*0.62;
    for(const k of keys){
      if(!k.black){ k.x0=mx+k.wi*ww; k.x1=k.x0+ww; k.y0=top; k.y1=bot;
        k.x=Math.round(k.x0+ww/2); k.y=Math.round(top+span*0.75); }
      else{ const cx=mx+(k.after+1)*ww; k.x0=cx-bw/2; k.x1=cx+bw/2; k.y0=top; k.y1=Math.round(top+span*0.56);
        k.x=Math.round(cx); k.y=Math.round(top+span*0.30); }
    }
  }else{
    const my=Math.round(H*0.02), lft=Math.round(W*0.03), rgt=Math.round(W*0.97);
    const rh=(H-2*my)/7, span=rgt-lft, bh=rh*0.62;
    for(const k of keys){
      if(!k.black){ k.y0=my+k.wi*rh; k.y1=k.y0+rh; k.x0=lft; k.x1=rgt;
        k.x=Math.round(lft+span*0.72); k.y=Math.round(k.y0+rh/2); }
      else{ const cy=my+(k.after+1)*rh; k.y0=cy-bh/2; k.y1=cy+bh/2; k.x0=lft; k.x1=Math.round(lft+span*0.56);
        k.x=Math.round(lft+span*0.28); k.y=Math.round(cy); }
    }
  }
}

function sampleColor(cx,cy){
  const x=Math.max(0,Math.min(canvas.width-1,cx))|0, y=Math.max(0,Math.min(canvas.height-1,cy))|0;
  const x0=Math.max(0,x-SAMPLE), y0=Math.max(0,y-SAMPLE);
  const w=Math.min(canvas.width-x0,SAMPLE*2), hh=Math.min(canvas.height-y0,SAMPLE*2);
  const d=ctx.getImageData(x0,y0,w,hh).data;
  let r=0,g=0,b=0,n=0;
  for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
  return {r:r/n,g:g/n,b:b/n};
}
function colorDist(a,b){const dr=a.r-b.r,dg=a.g-b.g,db=a.b-b.b;return Math.sqrt(dr*dr+dg*dg+db*db);}

/* ================= câmera ================= */
function showErr(m){const el=document.getElementById('startErr'); if(el) el.textContent=m;}
let starting=false;
async function start(){
  if(starting) return; starting=true; showErr('Abrindo a câmera…');
  try{ initAudio(); }catch(_){}
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showErr('A câmera precisa de HTTPS. Abra por um endereço https:// (ou localhost). Atual: '+location.protocol+'//'+location.host);
    starting=false; return;
  }
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}); }
  catch(e1){
    try{ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
    catch(e2){
      const n=e2.name||''; let dica='';
      if(n==='NotAllowedError') dica=' Permissão bloqueada: toque no cadeado ao lado do endereço → Permissões → Câmera → Permitir e recarregue.';
      else if(n==='NotReadableError') dica=' Outra aba/app está usando a câmera. Feche-os e tente de novo.';
      else if(n==='NotFoundError') dica=' Nenhuma câmera encontrada.';
      showErr('Falha ao abrir a câmera ('+(n||e2.message)+').'+dica); starting=false; return;
    }
  }
  showErr(''); starting=false;
  video.srcObject=stream; await video.play();
  document.getElementById('startScreen').classList.add('hidden');
  onResize();
  window.addEventListener('resize',onResize);
  window.addEventListener('orientationchange',()=>setTimeout(onResize,300));
  running=true; updateHint(); loop();
}
function decideRot(){
  const v=document.getElementById('view');
  if(rotAuto) rot = v.clientHeight > v.clientWidth;
}
function sizeCanvas(){
  const v=document.getElementById('view');
  let W=v.clientWidth, H=v.clientHeight;
  if(!W||!H) return;
  const cap=960, s=Math.min(1,cap/Math.max(W,H));
  canvas.width=Math.max(4,Math.round(W*s));
  canvas.height=Math.max(4,Math.round(H*s));
}
function resetBaselines(){ keys.forEach(k=>{k.baseline=null;k.pressed=false;}); allOff(); }
function onResize(){
  decideRot(); sizeCanvas(); layout();
  if(rot!==lastRot){ resetBaselines(); lastRot=rot; }
}
function updateHint(){
  document.getElementById('hint').innerHTML=
    '<b>Cubra o ponto</b> de cada tecla com o pé/dedo · pretas: alvo de um lado, brancas do outro · "Refazer fundo" após posicionar.';
}

/* desenha o vídeo preenchendo o canvas (corta o excedente, sem distorcer) */
function drawVideoCover(){
  const vw=video.videoWidth, vh=video.videoHeight; if(!vw||!vh) return;
  const cw=canvas.width, ch=canvas.height;
  const scale=Math.max(cw/vw, ch/vh);
  const sw=cw/scale, sh=ch/scale, sx=(vw-sw)/2, sy=(vh-sh)/2;
  ctx.drawImage(video, sx,sy,sw,sh, 0,0,cw,ch);
}

/* ================= loop ================= */
let frames=0,fpsT=0;
function loop(){
  if(!running) return;
  drawVideoCover();
  layout();
  const now=performance.now();
  const pressThresh=sensitivity, releaseThresh=Math.max(8,sensitivity*0.55);
  const mono=document.getElementById('mono').checked;

  for(const k of keys){
    const c=sampleColor(k.x,k.y);
    if(!k.baseline){ k.baseline={r:c.r,g:c.g,b:c.b}; }
    const dist=colorDist(c,k.baseline);
    k.delta=dist; k._snd=false;
    if(!k.pressed){
      k.baseline.r+=(c.r-k.baseline.r)*0.04; k.baseline.g+=(c.g-k.baseline.g)*0.04; k.baseline.b+=(c.b-k.baseline.b)*0.04;
      if(dist>pressThresh && now-k.lastChange>50){k.pressed=true;k.lastChange=now;}
    }else{
      if(dist<releaseThresh && now-k.lastChange>50){k.pressed=false;k.lastChange=now;}
    }
  }

  let playingLabel='—';
  if(mono){
    let target=null,bd=0;
    for(const k of keys){ if(k.pressed && k.delta>bd){bd=k.delta;target=k;} }
    const tid=target?target.id:null;
    if(tid!==monoCurrent){ if(monoCurrent) noteOff(monoCurrent); if(tid) noteOn(tid,keyMidi(target)); monoCurrent=tid; }
    if(target){ target._snd=true; playingLabel=keyLabel(target); }
  }else{
    for(const k of keys){
      if(k.pressed && !activeVoices[k.id]) noteOn(k.id,keyMidi(k));
      else if(!k.pressed && activeVoices[k.id]) noteOff(k.id);
      k._snd=k.pressed;
      if(k._snd) playingLabel=keyLabel(k);
    }
  }
  document.getElementById('playingLabel').textContent=playingLabel;

  drawKeyboard();

  frames++;
  if(now-fpsT>1000){document.getElementById('fps').textContent=frames+' fps';frames=0;fpsT=now;}
  requestAnimationFrame(loop);
}

function drawKeyboard(){
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  for(const k of keys){ if(k.black) continue;
    if(k._snd){ ctx.fillStyle='rgba(244,114,182,0.28)'; ctx.strokeStyle='#f472b6'; }
    else if(k.pressed){ ctx.fillStyle='rgba(148,163,184,0.22)'; ctx.strokeStyle='#94a3b8'; }
    else { ctx.fillStyle='rgba(244,246,255,0.13)'; ctx.strokeStyle='rgba(255,255,255,0.65)'; }
    ctx.lineWidth=2; roundRect(k.x0+2,k.y0+2,(k.x1-k.x0)-4,(k.y1-k.y0)-4,10); ctx.fill(); ctx.stroke();
    drawLabel(k); drawTarget(k,false);
  }
  for(const k of keys){ if(!k.black) continue;
    if(k._snd){ ctx.fillStyle='rgba(244,114,182,0.55)'; ctx.strokeStyle='#f472b6'; }
    else if(k.pressed){ ctx.fillStyle='rgba(120,130,150,0.55)'; ctx.strokeStyle='#94a3b8'; }
    else { ctx.fillStyle='rgba(11,13,22,0.60)'; ctx.strokeStyle='rgba(255,255,255,0.35)'; }
    ctx.lineWidth=2; roundRect(k.x0,k.y0,k.x1-k.x0,k.y1-k.y0,7); ctx.fill(); ctx.stroke();
    drawLabel(k); drawTarget(k,true);
  }
}
function drawLabel(k){
  ctx.fillStyle=k.black?'#e8eaf2':'#fff';
  ctx.font='bold '+(k.black?12:14)+'px system-ui';
  if(!rot){
    ctx.textAlign='center';
    if(k.black) ctx.fillText(keyLabel(k), k.x, k.y-SAMPLE-8);
    else ctx.fillText(keyLabel(k), k.x, k.y1-10);
  }else{
    ctx.textAlign='left';
    ctx.fillText(keyLabel(k), k.x0+10, (k.y0+k.y1)/2+5);
  }
}
function drawTarget(k,black){
  const r=black?SAMPLE+4:SAMPLE+8;
  if(k._snd){ ctx.fillStyle='rgba(244,114,182,0.6)'; ctx.strokeStyle='#f472b6'; }
  else { ctx.fillStyle='rgba(94,234,212,0.18)'; ctx.strokeStyle=black?'#5eead4':'#ffffff'; }
  ctx.lineWidth=3; ctx.beginPath(); ctx.arc(k.x,k.y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=k._snd?'#fff':'#5eead4'; ctx.beginPath(); ctx.arc(k.x,k.y,4,0,Math.PI*2); ctx.fill();
}
function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ================= controles ================= */
function setOctave(o){
  octaveBase=Math.max(1,Math.min(6,o));
  document.getElementById('octLabel').textContent=octaveBase;
  allOff();
}
document.getElementById('startBtn').onclick=start;
document.getElementById('octDown').onclick=()=>setOctave(octaveBase-1);
document.getElementById('octUp').onclick=()=>setOctave(octaveBase+1);
document.getElementById('rebg').onclick=()=>{ resetBaselines(); };
document.getElementById('rot').onclick=()=>{ rotAuto=false; rot=!rot; layout(); resetBaselines(); lastRot=rot; };
document.getElementById('sens').oninput=e=>{sensitivity=parseInt(e.target.value);};
document.getElementById('mono').onchange=allOff;
</script>
</body>
</html>
